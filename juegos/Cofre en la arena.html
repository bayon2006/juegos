<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cofre en la arena 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#9fd3e6;--fg:#2b1d0e;--card:#f6ecd2;--card2:#ecdcb5;--line:#c9a96b;--acc:#f2b632;--onacc:#2b1d0e;--ok:#2f7d4f;--mut:#6d5634;--sh:0 6px 18px rgba(30,20,5,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e262d;--fg:#f3e7c9;--card:#1f2f33;--card2:#2a3f44;--line:#54696b;--mut:#b9ab88;--ok:#7bd39b}}
:root[data-theme="dark"]{--bg:#0e262d;--fg:#f3e7c9;--card:#1f2f33;--card2:#2a3f44;--line:#54696b;--mut:#b9ab88;--ok:#7bd39b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--sh)}
#hud{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{display:flex;flex-direction:column;justify-content:center;min-width:76px;padding:6px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);line-height:1.15}
.chip small{color:var(--mut);font-size:.72rem}
.chip b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.chip.coin{background:var(--acc);border-color:#b98410;color:var(--onacc)}
.chip.coin small{color:#5b410a}

#help{font-size:.85rem;max-width:340px;cursor:pointer;color:var(--mut);align-self:center;padding:8px 12px}
button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;transition:transform .12s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.5;cursor:not-allowed}
button.acc{background:var(--acc);color:var(--onacc);border-color:#b98410;font-weight:700}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#tog{align-self:center;padding:10px 16px}
#shop{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 24px));max-height:74vh;display:flex;flex-direction:column;overflow:hidden;padding:0;border:2px solid var(--line);border-radius:16px;transform:translateZ(0)}
#shop.off{display:none}
.sh{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--card2);border-bottom:2px solid var(--line)}
.sh h2{margin:0;font-family:Georgia,serif;font-size:1.4rem}
.sh .bal{background:var(--acc);color:var(--onacc);font-weight:800;font-size:1.15rem;padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
#list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 16px 14px}
.cn{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:#f2b632;border:2px solid #b98410;vertical-align:-.1em;margin-right:.3em}
.gh{margin:16px 0 4px;font-family:Georgia,serif;font-size:1.05rem;font-weight:700;color:var(--mut)}
.up{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.gh+.up{border-top:0}
.ut{min-width:0}
.ut b{font-size:1.02rem}
.ut small{display:block;color:var(--mut);margin-top:2px;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.pips i{width:12px;height:6px;border-radius:3px;background:var(--line);opacity:.55}
.pips i.on{background:var(--ok);opacity:1}
.up button{min-width:92px;padding:10px 12px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.up button .cn{border-color:#8a5f08}
.up button.can{background:var(--acc);color:var(--onacc);border-color:#b98410}
.up.mx button{background:transparent;border-style:dashed}
#hint{font-weight:700;align-self:center}
#win{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:16px;pointer-events:none}
#win.on{display:flex}
#win .panel{pointer-events:auto;margin-top:6vh;text-align:center;max-width:400px;border:3px solid var(--acc);padding:22px}
#win h2{font-family:Georgia,serif;margin:0 0 8px}
@media (max-width:640px){#shop{left:10px;right:10px;width:auto;max-height:50vh}.chip{min-width:64px;padding:5px 9px}.chip b{font-size:1rem}.chip.coin b{font-size:1.25rem}}
#ctl{display:none}
@media (pointer:coarse){#ctl{display:block}#help{display:none}}
#joy{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:var(--card);border:2px solid var(--line);opacity:.85;touch-action:none}
#knob{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:var(--acc);pointer-events:none}

#dbtn button{touch-action:none;padding:16px 22px;font-size:1.05rem}
#ttl{font-size:clamp(1.3rem,5vw,1.9rem);animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#ttl{animation:none}button{transition:none}}
#bubble{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(92vw,460px);padding:12px 16px;border-radius:14px;background:var(--card);border:2px solid var(--acc);box-shadow:var(--sh);font-weight:600;display:none;z-index:3}
#bubble.on{display:block}
#openb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;z-index:4;padding:14px 24px;font-weight:700;font-size:1.1rem;box-shadow:var(--sh)}
#arrow{position:fixed;right:10px;top:calc(84px + env(safe-area-inset-top,0px));display:none;text-align:center}
#arw{font-size:1.6rem;line-height:1;color:var(--acc)}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;overflow:auto;background:linear-gradient(#78bfdc,#cfe8ef 52%,#e8d5a0 52%,#d6ba7b)}
#menu h1{margin:0;font-family:Georgia,serif;font-size:clamp(2rem,6vw,3.4rem);color:#2b1d0e;text-align:center}
#menu p{margin:0;color:#4a3820;text-align:center}
#modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:min(880px,100%)}
#modes button{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px 18px;background:#f6ecd2;color:#2b1d0e;border:2px solid #c9a96b;border-radius:16px;box-shadow:var(--sh)}
#modes button:hover{border-color:#b98410;background:#fbf3dc}
#modes b{font-family:Georgia,serif;font-size:1.6rem}
#modes span{line-height:1.35}
#modes svg{width:100%;height:auto;display:block}
#chm{align-self:center}
</style></head>
<body>
<canvas id="c" aria-label="Montículo de arena en 3D"></canvas>
<div id="hud">
  <div class="chip coin"><small>Monedas</small><b id="mo">0</b></div>
  <div class="chip"><small>Arena cavada</small><b><span id="vx">0</span> L</b></div>
  <div class="chip"><small>Tiempo</small><b id="tm">0:00</b></div>
  <div class="chip"><small>Modo</small><b id="mdn">Normal</b></div>
  <button id="chm">Cambiar modo</button>
  <button id="tog" class="acc">Tienda</button>
  <span id="hint" class="panel" style="display:none"></span>
  <div class="panel" id="help" title="Toca para ocultar">WASD mover · Espacio cavar · E abrir cofre · arrastra para girar · acércate al puesto para comprar</div>
</div>
<aside id="shop" class="panel" aria-label="Tienda de mejoras"><div class="sh"><h2>Tienda de mejoras</h2><span class="bal"><span class="cn"></span><span id="smo">0</span></span></div><div id="list"></div></aside>
<div id="bubble" role="status"></div><button id="openb" class="acc">Abrir cofre (E)</button><div id="arrow" class="panel"><div id="arw">▲</div><small id="ard"></small></div>
<div id="ctl"><div id="joy"><div id="knob"></div></div><div id="dbtn"><button class="acc" id="bd">Cavar</button></div></div>
<div id="win"><div class="panel"><h2 id="ttl">¡Cofre encontrado!</h2><p id="wt"></p><button class="acc" id="next">Otro cofre</button></div></div>
<div id="menu"><h1>Cofre en la arena</h1><p>Elige el tamaño del montículo donde está enterrado el cofre</p><div id="modes">
<button data-m="normal" autofocus><b>Normal</b><svg viewBox="0 0 140 76" aria-hidden="true"><rect x="4" y="58" width="5" height="10" fill="#b3262b"/><path d="M40 68 C55 68,60 24,70 24 S85 68,100 68Z" fill="#e0c48a" stroke="#a07a2c" stroke-width="2"/></svg><span>El montículo de siempre. Buen punto de partida.</span></button>
<button data-m="dificil"><b>Difícil</b><svg viewBox="0 0 140 76" aria-hidden="true"><rect x="4" y="58" width="5" height="10" fill="#b3262b"/><path d="M27 68 C48.5 68,55.6667 10,70 10 S91.5 68,113 68Z" fill="#e0c48a" stroke="#a07a2c" stroke-width="2"/></svg><span>Un montículo 3 veces más grande: hay mucha más arena que cavar.</span></button>
<button data-m="masivo"><b>Masivo</b><svg viewBox="0 0 140 76" aria-hidden="true"><rect x="4" y="58" width="5" height="10" fill="#b3262b"/><path d="M5 68 C37.5 68,48.3333 -4,70 -4 S102.5 68,135 68Z" fill="#e0c48a" stroke="#a07a2c" stroke-width="2"/></svg><span>Un montículo 10 veces más grande. Una montaña entera de arena.</span></button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="text/plain" id="game">
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;
ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;
const Mt=c=>new THREE.MeshLambertMaterial({color:c});
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xb8d4e6,150,700);
const cam=new THREE.PerspectiveCamera(50,1,.3,1500);
const hemi=new THREE.HemisphereLight(0xcfe6ff,0xb59a6a,.8);scene.add(hemi);
const SUNOFF=new THREE.Vector3(70,60,-45),sun=new THREE.DirectionalLight(0xfff1d6,1.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:220});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0006;sun.shadow.normalBias=.06;scene.add(sun,sun.target);

// Cielo realista: degradado, sol con halo y nubes procedurales
const skyM=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sd:{value:SUNOFF.clone().normalize()},tm:{value:0},dk:{value:0},tn:{value:new THREE.Vector3(1,1,1)}},
vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`varying vec3 vP;uniform vec3 sd,tn;uniform float tm,dk;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
void main(){vec3 d=normalize(vP);float y=max(d.y,0.);
vec3 c=mix(vec3(.72,.85,.94),vec3(.13,.36,.72),pow(y,.5));
float s=max(dot(d,sd),0.);c+=vec3(1.,.8,.5)*(pow(s,600.)*3.+pow(s,10.)*.22);
vec2 u=d.xz/(d.y+.12)*.9+vec2(tm*.01,tm*.004);float k=smoothstep(.48,.78,fb(u))*smoothstep(0.,.18,d.y);
c=mix(c,mix(vec3(.72,.76,.82),vec3(1.),smoothstep(.4,.9,fb(u+3.))),k*.92);
c*=tn;c=mix(c,vec3(.02,.03,.09),dk);gl_FragColor=vec4(c,1.);}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),skyM);sky.renderOrder=-1;scene.add(sky);

// Mar alrededor de la isla
const sea=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600).rotateX(-Math.PI/2),Mt(0x33737d));sea.position.y=-1.2;scene.add(sea);
const wc=document.createElement('canvas');wc.width=wc.height=256;const wg=wc.getContext('2d');
for(let q=0;q<900;q++){const x=Math.random()*256,y=Math.random()*256,r=4+Math.random()*10,gr=wg.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');wg.fillStyle=gr;wg.fillRect(x-r,y-r,2*r,2*r)}
const wtex=new THREE.CanvasTexture(wc);wtex.wrapS=wtex.wrapT=THREE.RepeatWrapping;wtex.repeat.set(160,160);
const water=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600).rotateX(-Math.PI/2),new THREE.MeshPhongMaterial({color:0x1e9ab5,transparent:true,opacity:.74,shininess:120,specular:0xffffff,bumpMap:wtex,bumpScale:1.2,depthWrite:false}));
water.position.y=.02;scene.add(water);

// Isla: malla de alturas con deslizamiento de arena y textura de grano
const FL=.35,SC=MODE.s,CS=MODE.cs,R=52*SC,PEAK=27*SC,RI=68*SC,G=Math.round(2*(RI+22)/CS)+1,HALF=(G-1)*CS/2,NB=[-1,1,-G,G],K=.5,HY=.9*K;
const hf=new Float32Array(G*G),orig=new Float32Array(G*G),nz=new Float32Array(G*G).map(()=>Math.random()-.5);
const geo=new THREE.BufferGeometry(),Pp=new Float32Array(G*G*3),Cc=new Float32Array(G*G*3),UV=new Float32Array(G*G*2),ind=[];
for(let k=0;k<G;k++)for(let i=0;i<G;i++){const v=k*G+i;Pp[3*v]=i*CS-HALF;Pp[3*v+2]=k*CS-HALF;UV[2*v]=i*CS/2.5;UV[2*v+1]=k*CS/2.5;
  if(i<G-1&&k<G-1)ind.push(v,v+G,v+1,v+1,v+G,v+G+1);}
geo.setAttribute('position',new THREE.BufferAttribute(Pp,3));geo.setAttribute('color',new THREE.BufferAttribute(Cc,3));
geo.setAttribute('uv',new THREE.BufferAttribute(UV,2));geo.setIndex(ind);
const tc=document.createElement('canvas');tc.width=tc.height=256;const tg=tc.getContext('2d'),td=tg.createImageData(256,256);
for(let q=0;q<65536;q++){const v=205+Math.random()*50|0;td.data.set([v,v,v,255],q*4)}
tg.putImageData(td,0,0);const tex=new THREE.CanvasTexture(tc);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
const terr=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,vertexColors:true,roughness:1,metalness:0}));
terr.castShadow=terr.receiveShadow=true;terr.frustumCulled=false;scene.add(terr);
let bx=null,dirty=false;
const Nn=new Float32Array(G*G*3);geo.setAttribute('normal',new THREE.BufferAttribute(Nn,3));
let ub=null;const mark=b=>{ub=ub?[Math.min(ub[0],b[0]),Math.max(ub[1],b[1]),Math.min(ub[2],b[2]),Math.max(ub[3],b[3])]:b.slice()};
function upd(b){
  const i0=b?clamp(b[0]-1,0,G-1):0,i1=b?clamp(b[1]+1,0,G-1):G-1,k0=b?clamp(b[2]-1,0,G-1):0,k1=b?clamp(b[3]+1,0,G-1):G-1;
  for(let k=k0;k<=k1;k++)for(let i=i0;i<=i1;i++){
    const v=k*G+i,y=hf[v];Pp[3*v+1]=y;
    let f=1-clamp((orig[v]-y)*.05,0,.35)+nz[v]*.08+.3*Math.max(0,1-Math.abs(y-.05)/.12);
    if(y<.3)f*=.8+.2*clamp(y/.3,0,1);
    const t=clamp(-y/1.2,0,1);
    Cc[3*v]=.95*f*(1-t)+.2*t;Cc[3*v+1]=.82*f*(1-t)+.45*t;Cc[3*v+2]=.58*f*(1-t)+.5*t;
    const nx=hf[v-(i>0?1:0)]-hf[v+(i<G-1?1:0)],nzz=hf[v-(k>0?G:0)]-hf[v+(k<G-1?G:0)],ny=2*CS,l=Math.hypot(nx,ny,nzz);
    Nn[3*v]=nx/l;Nn[3*v+1]=ny/l;Nn[3*v+2]=nzz/l;
  }
  geo.attributes.position.needsUpdate=geo.attributes.color.needsUpdate=geo.attributes.normal.needsUpdate=true;
}
function relax(b){
  let mv=0;const T=CS*.85;
  for(let pass=0;pass<3;pass++)for(let k=Math.max(1,b[2]);k<=Math.min(G-2,b[3]);k++)for(let i=Math.max(1,b[0]);i<=Math.min(G-2,b[1]);i++){
    const c=k*G+i;
    for(let q=0;q<4;q++){const n=c+NB[q],d=hf[c]-hf[n]-T;if(d>0){const m=d*.25;hf[c]-=m;hf[n]+=m;mv+=m}}
  }
  return mv;
}
function H(x,z){
  const u=(x+HALF)/CS,w=(z+HALF)/CS;if(u<0||w<0||u>=G-1||w>=G-1)return -1.2;
  const i=Math.floor(u),k=Math.floor(w),fu=u-i,fw=w-k,a=hf[k*G+i],b=hf[k*G+i+1],c=hf[(k+1)*G+i],d=hf[(k+1)*G+i+1];
  return(a*(1-fu)+b*fu)*(1-fw)+(c*(1-fu)+d*fu)*fw;
}
function build(){
  const dn=[];for(let q=0;q<0;q++){const a=Math.random()*6.28,r=44+Math.random()*7;dn.push([Math.cos(a)*r,Math.sin(a)*r,9+Math.random()*5,4+Math.random()*4])}
  for(let k=0;k<G;k++)for(let i=0;i<G;i++){
    const x=i*CS-HALF,z=k*CS-HALF,d=Math.hypot(x,z);let h=.6*clamp((RI-d)/9,-2,1);
    if(d<R)h+=PEAK*.5*(1+Math.cos(Math.PI*d/R));
    for(const q of dn){const e=Math.hypot(x-q[0],z-q[1]);if(e<q[2])h+=q[3]*.5*(1+Math.cos(Math.PI*e/q[2]))}
    hf[k*G+i]=h;
  }
  for(let n=0;n<70;n++)relax([1,G-2,1,G-2]);
  for(let k=0;k<G;k++)for(let i=0;i<G;i++){const x=i*CS-HALF,z=k*CS-HALF,f=clamp((RI-4-Math.hypot(x,z))/8,0,1);
    hf[k*G+i]+=f*.1*Math.sin(x*1.6+z*.7+Math.sin(z*.5)*2);orig[k*G+i]=hf[k*G+i];}
  bx=null;ub=null;upd();
}
const palms=[];for(let q=0;q<9;q++){
  const g=new THREE.Group(),tk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.28,5,8),Mt(0x7a5a35));tk.position.y=2.5;tk.castShadow=true;g.add(tk);
  const top=new THREE.Group();top.position.y=5;
  for(let l=0;l<7;l++){const lf=new THREE.Mesh(new THREE.BoxGeometry(.5,.04,3),Mt(0x2f7d32)),pv=new THREE.Group();lf.position.z=1.4;lf.rotation.x=.45;lf.castShadow=true;pv.rotation.y=l*.9;pv.add(lf);top.add(pv)}
  g.add(top);g.rotation.z=q%2?.12:-.12;scene.add(g);palms.push(g);
}

// Partículas
function mkP(col,sz,n,g){const pos=new Float32Array(n*3).fill(-99),vel=new Float32Array(n*3),life=new Float32Array(n);let c=0;
  const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const o=new THREE.Points(ge,new THREE.PointsMaterial({color:col,size:sz}));o.frustumCulled=false;scene.add(o);
  return{puff(x,y,z,k,sp=3,up=4){for(let q=0;q<k;q++){const a=c++%n;pos[3*a]=x+(Math.random()-.5)*.8;pos[3*a+1]=y;pos[3*a+2]=z+(Math.random()-.5)*.8;

function frame(t){

    for(let i=0;i<RN;i++){rp[3*i+1]-=(sd?3:28)*dt;rp[3*i]+=(sd?22:2)*dt;if(rp[3*i+1]<0)rp[3*i+1]=25;if(rp[3*i]>20)rp[3*i]=-20}rg.attributes.position.needsUpdate=true}
  lantern.getWorldPosition(plant.position);plant.intensity=lv.lantern?(.3+env.dk*2.2)*1.5:0;lgM.color.setHex(0xffcc55);
