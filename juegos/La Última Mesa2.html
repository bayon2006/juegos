<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Última Mesa</title>
<style>
:root{--n:#4dff7a;--mag:#ff3df0;--ora:#ff9a2e;--cy:#3df2ff;--blu:#2b2fd6;--ink:#0a0912;--cream:#f0e6cf;--gold:#ffd24a;--line:#3b2f7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 0,#2a1450 0%,#0a0912 70%);color:var(--cream);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
h1,h2,h3{margin:0;letter-spacing:.06em}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#0d0a22;border-bottom:2px solid var(--mag);box-shadow:0 0 18px rgba(255,61,240,.4);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.hud div{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.1em}
.hud b{color:var(--n);font-size:17px;display:block;text-shadow:0 0 8px var(--n)}
main{flex:1;padding:14px;max-width:1180px;margin:0 auto;width:100%;display:flex;flex-direction:column}
.title{text-align:center;margin-bottom:10px}
.title h1{font-size:26px;color:#ffd6fb;text-transform:uppercase;text-shadow:0 0 6px var(--mag),0 0 18px var(--mag)}
.title p{margin:4px 0 0;opacity:.7;font-size:13px}
#room,#roomP{position:relative;width:min(100%,calc(82vh*16/9));margin:0 auto;aspect-ratio:16/9;background:#0a0912;border:2px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 0 30px rgba(255,61,240,.25),0 18px 40px rgba(0,0,0,.6)}
#room::after,#roomP::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5000;box-shadow:inset 0 0 80px 20px rgba(5,3,14,.75)}
.bg{position:absolute;inset:0;width:100%;height:100%}
.table{position:absolute;width:24%;min-width:84px;transform:translate(-50%,-69.4%);user-select:none;pointer-events:none}
.table svg{display:block;width:100%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:filter .15s}
.table.near svg{filter:drop-shadow(0 0 10px var(--n)) drop-shadow(0 0 2px var(--n))}
.table .lbl{position:absolute;left:50%;top:91%;transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(10,9,18,.8);border:1px solid var(--n);color:#d8ffe3;border-radius:10px;padding:2px 9px;box-shadow:0 0 8px rgba(77,255,122,.4)}
.table .hint{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:10px;color:var(--n);white-space:nowrap;opacity:0;text-shadow:0 0 6px var(--n)}
.table.near .hint{opacity:1}
#player,#playerP{position:absolute;width:clamp(26px,4.6%,48px);aspect-ratio:40/56;transform:translate(-50%,-90%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
#player .ch,#playerP .ch{display:block;width:100%;height:100%;transform:scaleX(var(--f,1));overflow:visible}
.walk .bd{animation:bob .36s infinite alternate}
.walk .l1{animation:st .36s infinite alternate}
.walk .l2{animation:st .36s infinite alternate-reverse}
@keyframes bob{to{transform:translateY(-1.5px)}}
@keyframes st{to{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes deal{from{transform:translateY(-22px) rotate(-8deg);opacity:0}}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px}
.dpad button{padding:0;font-size:16px;border-radius:8px}
.dpad .mid{visibility:hidden}
.actbtn{padding:12px 20px;font-size:15px}
.hintline{font-size:12px;opacity:.65;text-align:center;margin-top:6px}
.panel{background:linear-gradient(#171436,#0e0c24);border:2px solid var(--n);border-radius:14px;padding:18px;margin-top:10px;max-width:760px;margin-left:auto;margin-right:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0;justify-content:center}
button{font:inherit;background:var(--blu);color:#eafff0;border:2px solid var(--n);border-radius:9px;padding:8px 15px;font-weight:700;cursor:pointer;letter-spacing:.03em;box-shadow:0 0 10px rgba(77,255,122,.4),0 3px 0 #14166a}
button:hover{background:#3d43ff}
button.secondary{background:transparent;color:var(--cream);border-color:var(--mag);box-shadow:0 0 10px rgba(255,61,240,.35)}
button.secondary:hover{background:rgba(255,61,240,.15)}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=number]{font:inherit;width:100px;padding:8px 10px;border-radius:8px;border:2px solid var(--line);background:#0a0918;color:var(--cream)}
.choice{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.choice:hover{background:rgba(77,255,122,.12)}
.choice.sel{background:var(--n);color:#062012;border-color:var(--n);box-shadow:0 0 12px var(--n)}
.costumeCard{background:#171436;border:2px solid var(--line);border-radius:10px;padding:12px 14px;width:118px;display:flex;flex-direction:column;align-items:center;gap:6px}
.costumeCard.sel{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,74,.5)}
.costIcon{font-size:34px}
.costName{font-size:13px;font-weight:700;text-align:center}
.log{font-size:15px;min-height:22px;margin:10px 0;color:var(--n);text-shadow:0 0 6px rgba(77,255,122,.6)}
.cards{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.pc{width:52px;height:74px;padding:6px 7px;text-align:left;font-size:20px;border-radius:7px;background:linear-gradient(#fff,#e6def4);color:#1a1030;font-weight:700;box-shadow:0 0 10px rgba(61,242,255,.35),0 3px 8px rgba(0,0,0,.6);animation:deal .3s}
.wheel-result{font-size:32px;font-weight:700;text-align:center;margin:12px 0;color:#ffd6fb;text-shadow:0 0 12px var(--mag)}
.lane{display:flex;align-items:center;gap:10px;margin:8px 0}
.lane .name{width:64px;font-size:13px}
.lane .bar{flex:1;height:16px;background:#1a1440;border-radius:8px;overflow:hidden;border:1px solid var(--ora)}
.lane .fill{height:100%;background:linear-gradient(90deg,#ff5a2e,var(--ora));width:0%}
.reels{display:flex;gap:10px;justify-content:center;width:fit-content;margin:14px auto;padding:16px;background:#0c0820;border:3px solid #ff4d6d;border-radius:12px;box-shadow:0 0 18px rgba(255,77,109,.5),inset 0 0 20px #000}
.reel{width:70px;height:78px;background:linear-gradient(#cfc6b0,#fff 30%,#fff 70%,#cfc6b0);color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
.dice{display:flex;gap:14px;justify-content:center;margin:14px 0;font-size:56px;text-shadow:0 0 14px var(--cy)}
.overlay{position:fixed;inset:0;background:rgba(5,3,14,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99999}
.overlay .box{background:#120e2e;border:2px solid var(--mag);border-radius:14px;padding:30px;max-width:400px;text-align:center;box-shadow:0 0 30px rgba(255,61,240,.45)}
.overlay h2{color:#ffd6fb;font-size:24px;margin-bottom:10px;text-shadow:0 0 10px var(--mag)}
.hidden{display:none}
#game .panel{position:relative;overflow:hidden;border-color:var(--c,var(--n));box-shadow:0 0 26px var(--c,var(--n)),inset 0 0 50px rgba(0,0,0,.6);background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 18px),linear-gradient(#171436,#0e0c24)}
#gameArea>*{position:relative;z-index:1}
#game .panel h2{color:var(--c,var(--n));text-shadow:0 0 10px var(--c,var(--n));text-transform:uppercase}
#game[data-t=ruleta]{--c:#ff3df0}#game[data-t=blackjack]{--c:#4dff7a}#game[data-t=carreras]{--c:#ff9a2e}#game[data-t=tragaperras]{--c:#ff4d6d}#game[data-t=dados]{--c:#3df2ff}
#game[data-t=ruleta] #gameArea::before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(#ffd24a 0 14px,#160f33 15px 26px,transparent 27px),repeating-conic-gradient(#ff3d6a 0 9.73deg,#0c0820 9.73deg 19.46deg);box-shadow:0 0 0 6px #160f33,0 0 0 8px var(--mag),0 0 24px var(--mag);animation:spin 14s linear infinite}
.felt{border-radius:50%/18%;background:radial-gradient(ellipse at 50% 35%,#0f3d2a,#08241a 75%);border:6px solid #6b4a22;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 8px 18px rgba(0,0,0,.5);padding:22px 18px;margin:12px 0}
.chip{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;font-size:11px;font-weight:800;text-transform:uppercase;cursor:pointer;border:3px dashed #fff8;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 8px rgba(0,0,0,.5);transition:transform .12s}
.chip:hover{transform:translateY(-2px) scale(1.05)}
.chip.sel{outline:3px solid var(--gold);transform:translateY(-3px) scale(1.08)}
.chip.rojo{background:radial-gradient(circle,#ff5a6e,#b8102a)}
.chip.negro{background:radial-gradient(circle,#3a3a46,#0c0c14)}
.chip.par,.chip.impar{background:radial-gradient(circle,#3df2ff,#0f6a7a);color:#04222a}
.chip.val{width:50px;height:50px;font-size:11px;border:2px solid #fff8;border-style:dashed}
.chip.val.off{opacity:.3;cursor:not-allowed}
.rboardWrap{overflow-x:auto;padding-bottom:4px}
.rboard{display:grid;grid-template-columns:56px repeat(12,42px);grid-auto-rows:36px;gap:2px;background:#08241a;border:6px solid #6b4a22;border-radius:10px;padding:6px;box-shadow:inset 0 0 30px rgba(0,0,0,.5);width:max-content}
.rboard .rcell{background:#0f3d2a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#eafff0;cursor:pointer;border:1px solid rgba(255,255,255,.22);border-radius:3px;user-select:none;position:relative}
.rboard .rcell:hover{filter:brightness(1.3)}
.betBadge{position:absolute;bottom:-6px;right:-4px;background:var(--gold);color:#3a2408;font-size:9px;font-weight:800;padding:1px 4px;border-radius:8px;box-shadow:0 0 6px rgba(255,210,74,.7);pointer-events:none}
.rboard .rzero{grid-row:1/4;grid-column:1;background:#137a3f;font-size:16px;border-radius:6px 0 0 6px}
.rboard .red{color:#ff4141}
.rboard .black{color:#eee}
.rboard .rcol2a1{font-size:9px;background:#0c3322}
.rboard .rdozen{font-size:10px;letter-spacing:.04em}
.rboard .rout{font-size:11px}
.rboard .diamond{font-size:18px}
.rboard .diamond.blk{color:#151520;text-shadow:0 0 3px #fff8}
.rboard .diamond.rd{color:#ff4141}
.rboard .rcell.sel{outline:3px solid var(--gold);box-shadow:0 0 12px var(--gold);z-index:2}
.pocket{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;font-size:26px;font-weight:800;margin:10px auto;border:3px solid var(--gold);box-shadow:0 0 16px rgba(255,210,74,.5)}
.pocket.red{background:#c11430}.pocket.black{background:#141420}.pocket.green{background:#137a3f}
.cards{gap:10px}
.pc{width:60px;height:86px;font-size:22px;border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#fff,#f2eefa);box-shadow:0 0 10px rgba(61,242,255,.35),0 4px 10px rgba(0,0,0,.6);position:relative}
.pc.red{color:#c1122e}.pc.black{color:#111}
.pc .suit{position:absolute;right:6px;bottom:4px;font-size:22px}
.pc.back{background:repeating-linear-gradient(45deg,#2b2fd6,#2b2fd6 5px,#1a1e8f 5px 10px);box-shadow:0 0 8px rgba(43,47,214,.6),0 4px 10px rgba(0,0,0,.6);border:2px solid #3df2ff44}
.bjHalf{margin:10px 0}
.bjHalf h3{color:var(--n);text-shadow:0 0 6px var(--n);margin-bottom:6px}
.reels{background:linear-gradient(#3a2408,#1a1004);border-color:var(--gold);box-shadow:0 0 22px rgba(255,210,74,.5),inset 0 0 20px #000;position:relative}
.reel{transition:transform .08s}
.reel.spinning{animation:reelspin .09s linear infinite}
@keyframes reelspin{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.slotCab{background:linear-gradient(#5a3a10,#2a1806);border:6px solid var(--gold);border-radius:20px;padding:18px 16px 26px;box-shadow:0 0 30px rgba(255,210,74,.4),inset 0 0 20px rgba(0,0,0,.5);max-width:340px;margin:12px auto}
.slotLights{display:flex;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.slotLights span{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:blink 1s infinite}
.slotLights span:nth-child(even){animation-delay:.5s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.payline{position:absolute;left:8px;right:8px;top:50%;height:2px;background:#ff3d3d;box-shadow:0 0 8px #ff3d3d;pointer-events:none;z-index:2}
.reels.win{animation:winflash .5s ease 3}
@keyframes winflash{0%,100%{box-shadow:0 0 22px rgba(255,210,74,.5)}50%{box-shadow:0 0 46px rgba(255,210,74,1)}}
.paytable{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.paytable div{background:#0c0820;border:1px solid var(--gold);border-radius:8px;padding:4px 9px}
.paytable b{color:var(--gold)}
.lever{width:14px;height:74px;background:linear-gradient(#ffd24a,#a86a00);border-radius:7px;margin:14px auto 0;box-shadow:0 0 10px var(--gold);position:relative;cursor:pointer}
.lever::after{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#ff5a6e,#8a0e22);box-shadow:0 0 10px rgba(255,77,109,.7)}

.diceTable{background:radial-gradient(ellipse at 50% 40%,#0d3a3f,#062226 75%);border:6px solid #1c5a63;border-radius:20px;padding:20px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.dice.rolling{animation:diceroll .5s ease}
@keyframes diceroll{0%{transform:rotate(0)}25%{transform:rotate(-18deg)}50%{transform:rotate(14deg)}75%{transform:rotate(-8deg)}100%{transform:rotate(0)}}
.track{background:linear-gradient(180deg,#3a2a12,#241a0a);border:4px solid var(--ora);border-radius:12px;padding:14px;box-shadow:inset 0 0 24px rgba(0,0,0,.5)}
.lane{background:rgba(0,0,0,.25);border-radius:8px;padding:4px 8px}
.lane .bar{border-width:2px;position:relative}
.lane .bar::after{content:"🏁";position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.7}
.lane .fill{box-shadow:0 0 8px rgba(255,154,46,.7)}
.hippodrome{position:relative;background:repeating-linear-gradient(180deg,#3a2a12 0 4px,#33240f 4px 8px);border:4px solid var(--ora);border-radius:12px;padding:14px 44px 14px 14px;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.finishline{position:absolute;right:24px;top:10px;bottom:10px;width:10px;background:repeating-linear-gradient(0deg,#fff 0 8px,#111 8px 16px);box-shadow:0 0 10px rgba(255,255,255,.5);border-radius:3px}
.hlane{position:relative;display:flex;align-items:center;gap:8px;margin:10px 0;border-radius:8px;transition:background .3s}
.hlane.winner{background:rgba(255,210,74,.18);box-shadow:0 0 14px rgba(255,210,74,.6)}
.hname{width:64px;font-size:12px;font-weight:800;text-shadow:0 0 4px currentColor}
.hbar{position:relative;flex:1;height:34px;background:rgba(0,0,0,.3);border-radius:8px;border-bottom:2px dashed rgba(255,255,255,.15)}
.horse{position:absolute;top:50%;left:0%;transform:translate(-50%,-50%) scaleX(-1);font-size:26px;transition:left .16s linear;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.horse.run{animation:gallop .28s infinite}
@keyframes gallop{0%,100%{margin-top:0}50%{margin-top:-4px}}
.jockey{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#171436,#0e0c24);border:2px solid var(--jc,var(--line));color:var(--cream);border-radius:10px;padding:8px 12px;box-shadow:none}
.jockey .silk{width:13px;height:13px;border-radius:50%;background:var(--jc);box-shadow:0 0 6px var(--jc)}
.jockey b{color:var(--jc);margin-left:2px}
.jockey.sel{box-shadow:0 0 12px var(--jc);background:rgba(255,255,255,.08)}
.pbtn{margin-bottom:10px}
#parking .title h1{color:#dfe6ee;text-shadow:0 0 4px #9fc4e8}
#parking .title p{color:#9aa0a8}
#roomP{border-color:#3a3a42;box-shadow:0 0 20px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.6)}
#roomP .table .lbl{border-color:#8fa3b8;color:#eef2f8;background:rgba(10,10,12,.85);box-shadow:0 0 6px rgba(180,200,220,.4)}
#roomP .table .hint{color:#dff0ff;text-shadow:0 0 5px #9fc4e8}
#roomP .table.near svg{filter:drop-shadow(0 0 8px #cfe8ff) drop-shadow(0 0 2px #cfe8ff)}
.table.door .lbl{border-color:var(--gold);color:#3a2408;background:linear-gradient(#ffe9a8,#ffd24a);box-shadow:0 0 10px rgba(255,210,74,.6);font-weight:800}
.table.door .hint{color:var(--gold);text-shadow:0 0 6px var(--gold)}
.table.door.near svg{filter:drop-shadow(0 0 12px var(--gold)) drop-shadow(0 0 3px var(--gold))}
.table.door.locked svg{filter:grayscale(1) brightness(.55)!important;opacity:.7}
.table.door.locked .lbl{background:rgba(20,16,8,.85);color:#8a7550;border-color:#5a4a28;box-shadow:none}
.table.door .lockbadge{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:15px;display:none;text-shadow:0 0 6px #000;z-index:2}
.table.door.locked .lockbadge{display:block}
.table.door{width:9%;min-width:30px}
#wallVipDoor{transition:filter .2s,opacity .2s}
#wallVipDoor .lockicon{display:none}
#wallVipDoor.locked{opacity:.6;filter:grayscale(1) brightness(.55)}
#wallVipDoor.locked .lockicon{display:block}
#wallVipDoor.near:not(.locked){filter:drop-shadow(0 0 14px #ffd24a) drop-shadow(0 0 4px #ffd24a)}
#wallExitDoor.near{filter:drop-shadow(0 0 14px #4dff7a) drop-shadow(0 0 4px #4dff7a)}
#wallExitDoor{filter:drop-shadow(0 0 6px rgba(77,255,122,.45))}
.table.bar{width:19%;min-width:68px}
.table.bar .lbl{border-color:var(--gold);color:#3a2408;background:linear-gradient(#ffe9a8,#ffd24a);box-shadow:0 0 10px rgba(255,210,74,.55);font-weight:800}
.table.bar .hint{color:var(--gold);text-shadow:0 0 6px var(--gold)}
.table.bar.near svg{filter:drop-shadow(0 0 12px var(--gold)) drop-shadow(0 0 3px var(--gold))}
#vip .title h1{color:#ffe9a8;text-shadow:0 0 6px var(--gold),0 0 20px var(--gold)}
#vip .title p{color:#cbb27a}
#roomV{position:relative;width:min(100%,calc(82vh*16/9));margin:0 auto;aspect-ratio:16/9;background:#0a0912;border:2px solid var(--gold);border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 0 40px rgba(255,210,74,.35),0 18px 40px rgba(0,0,0,.65)}
#roomV::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5000;box-shadow:inset 0 0 90px 24px rgba(5,3,10,.8)}
#playerV{position:absolute;width:clamp(26px,4.6%,48px);aspect-ratio:40/56;transform:translate(-50%,-90%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
#playerV .ch{display:block;width:100%;height:100%;transform:scaleX(var(--f,1));overflow:visible}

#view{position:relative;width:min(100%,calc(82vh*16/9));margin:0 auto;aspect-ratio:16/9;background:#0a0912;border:2px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 0 30px rgba(255,61,240,.25),0 18px 40px rgba(0,0,0,.6)}
#view canvas{touch-action:none;cursor:grab;display:block}
#view[data-k="v"]{border-color:var(--gold);box-shadow:0 0 40px rgba(255,210,74,.35),0 18px 40px rgba(0,0,0,.65)}
#view[data-k="p"]{border-color:#3a3a42;box-shadow:0 0 20px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>

<div class="hud">
  <div>Día<b id="hDay">1</b></div>
  <div>Banca<b id="hMoney">500€</b></div>
  <div>Objetivo<b id="hTarget">800€</b></div>
  <div>Monedas<b id="hCoins">🪙0</b></div>
  <div>Tiempo<b id="hTime">10:00</b></div>
</div>

<main>
  <div id="world">
    <div class="title">
      <h1 id="wTitle">La Última Mesa</h1>
      <p id="wSub">Muévete por la sala y acércate a una mesa para jugar.</p>
    </div>
    <div id="view"></div>
    <div class="controls">
      <div class="dpad">

let state = { day:1, money:500, target:800, timeLeft:600, timerId:null, locked:false, coins:0, costume:'default', owned:['default'] };
function fmt(n){ return Math.round(n)+'€'; }
function updateHUD(){
  document.getElementById('hDay').textContent = state.day;
  document.getElementById('hMoney').textContent = fmt(state.money);
  document.getElementById('hTarget').textContent = fmt(state.target);
  document.getElementById('hCoins').textContent = '🪙'+state.coins;
  const m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
  document.getElementById('hTime').textContent = m+':'+String(s).padStart(2,'0');
  const skip = document.getElementById('skipBtn');
  if(skip) skip.classList.toggle('hidden', !(state.money>=state.target && !state.locked));
}
function skipDay(){
  if(state.money>=state.target && !state.locked){ endDay(true, ''); }
}
function startTimer(){
  clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    if(state.locked) return;
    state.timeLeft--;
    updateHUD();
    if(state.money < 1){ endDay(false,'te has quedado sin dinero'); }
    else if(state.timeLeft <= 0){ endDay(state.money>=state.target, 'se acabó el tiempo'); }
  },1000);
}
function endDay(success, reason){
  state.locked = true;
  clearInterval(state.timerId);
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  if(success){
    const coinsWon = 2 + Math.floor(Math.random()*4);
    state.coins += coinsWon;
    updateHUD();
    document.getElementById('ovTitle').textContent = 'Día '+state.day+' superado';
    document.getElementById('ovText').textContent = 'Llegaste a '+fmt(state.money)+'. Ganas 🪙'+coinsWon+' monedas doradas. Mañana piden más.';
    document.getElementById('ovBtn').textContent = 'Empezar día '+(state.day+1);
    document.getElementById('ovBtn').onclick = nextDay;
  } else {
    document.getElementById('ovTitle').textContent = 'Fin de la partida';
    document.getElementById('ovText').textContent = 'Día '+state.day+': '+reason+'. Llegaste con '+fmt(state.money)+' (objetivo '+fmt(state.target)+').';
    document.getElementById('ovBtn').textContent = 'Volver a empezar';
    document.getElementById('ovBtn').onclick = restart;
  }
}
function nextDay(){
  state.day++; state.target = Math.round(state.target*1.55/10)*10; state.timeLeft = 600; state.locked = false;
  document.getElementById('overlay').classList.add('hidden');
  clearInterval(state.timerId);
  goParking(); updateHUD();
}
function restart(){
  state = { day:1, money:500, target:800, timeLeft:600, timerId:null, locked:false, coins:0, costume:'default', owned:['default'] };
  document.getElementById('overlay').classList.add('hidden');
  clearInterval(state.timerId);
  applyCostume();
  goParking(); updateHUD();
}
function checkBust(){
  if(state.money < 1 && !state.locked){ endDay(false, 'te has quedado sin dinero'); }
}

function applyCostume(){
  const c = COSTUMES[state.costume] || COSTUMES.default;
  const html = SHADOW + LEGS(c.pant, c.shoe) + '<g class="bd">' + c.body + '</g>';
  ['player','playerP','playerV'].forEach(id=>{
    const el = document.getElementById(id);
    const svg = el && el.querySelector('svg.ch');
    if(svg) svg.innerHTML = html;
  });
}
function buyCostume(id){
  const c = COSTUMES[id];
  if(!c || state.owned.includes(id) || state.coins < c.price) return;
  state.coins -= c.price;
  state.owned.push(id);
  updateHUD();
  renderShop();
}
function equipCostume(id){
  if(id!=='default' && !state.owned.includes(id)) return;
  state.costume = id;
  applyCostume();
  renderShop();
}
function renderShop(){
  const grid = document.getElementById('shopGrid');
  if(!grid) return;
  grid.innerHTML = Object.keys(COSTUMES).filter(id=>id!=='default').map(id=>{
    const c = COSTUMES[id];
    const owned = state.owned.includes(id);
    const equipped = state.costume===id;
    let label, action, dis='';
    if(equipped){ label='Equipado'; action=''; dis='disabled'; }
    else if(owned){ label='Equipar'; action="equipCostume('"+id+"')"; }
    else { label='Comprar ('+c.price+' 🪙)'; action="buyCostume('"+id+"')"; if(state.coins<c.price) dis='disabled'; }

/* ---------- RULETA ---------- */
const ROJOS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const CHIP_VALS = [20,100,200,500,1000];
const CHIP_COLORS = {20:'#3df2ff',100:'#1a1a22',200:'#ff9a2e',500:'#b23df2',1000:'#ffd24a'};
const EXCL_GROUPS = [['rojo','negro'],['par','impar'],['bajo','alto'],['docena1','docena2','docena3']];
const RLABELS = {rojo:'Rojo',negro:'Negro',par:'Par',impar:'Impar',bajo:'1-18',alto:'19-36',docena1:'1ª docena',docena2:'2ª docena',docena3:'3ª docena'};
let bets = {}, activeChipVal = null, selectedChip = 20;
function exclConflict(type){
  for(const g of EXCL_GROUPS){
    if(g.includes(type)){
      for(const other of g){ if(other!==type && bets[other]) return other; }
    }
  }
  return null;
}
function chipBetHTML(){
  return `<div class="row"><span>Apostado: <b id="rTotalBet" style="color:var(--gold)">0€</b></span>
    <button class="secondary" onclick="clearBets()">Limpiar apuestas</button></div>
  <div class="row">${CHIP_VALS.map(a=>`<div class="chip val" data-v="${a}" style="background:${CHIP_COLORS[a]};color:${a===1000||a===20?'#111':'#fff'}" onclick="chipPick(${a},this)">${a}€</div>`).join('')}</div>`;
}
function chipPick(amt, el){
  if(el.classList.contains('off')) return;
  selectedChip = amt;
  refreshBoardUI();
}
function buildRouletteBoard(){
  let h = `<div class="rzero rcell" data-key="num0" onclick="rBoardClick('num',0,this)">0<span class="betBadge"></span></div>`;
  for(let n=1;n<=12;n++){
    const top=3*n, mid=3*n-1, bot=3*n-2;
    h += `<div class="rcell ${ROJOS.includes(top)?'red':'black'}" data-key="num${top}" style="grid-row:1;grid-column:${n+1}" onclick="rBoardClick('num',${top},this)">${top}<span class="betBadge"></span></div>`;
    h += `<div class="rcell ${ROJOS.includes(mid)?'red':'black'}" data-key="num${mid}" style="grid-row:2;grid-column:${n+1}" onclick="rBoardClick('num',${mid},this)">${mid}<span class="betBadge"></span></div>`;
    h += `<div class="rcell ${ROJOS.includes(bot)?'red':'black'}" data-key="num${bot}" style="grid-row:3;grid-column:${n+1}" onclick="rBoardClick('num',${bot},this)">${bot}<span class="betBadge"></span></div>`;
  }
  h += `<div class="rcell rdozen" data-key="docena1" style="grid-row:4;grid-column:2/6" onclick="rBoardClick('docena1',null,this)">1ª DOCENA<span class="betBadge"></span></div>`;
  h += `<div class="rcell rdozen" data-key="docena2" style="grid-row:4;grid-column:6/10" onclick="rBoardClick('docena2',null,this)">2ª DOCENA<span class="betBadge"></span></div>`;
  h += `<div class="rcell rdozen" data-key="docena3" style="grid-row:4;grid-column:10/14" onclick="rBoardClick('docena3',null,this)">3ª DOCENA<span class="betBadge"></span></div>`;
  h += `<div class="rcell rout" data-key="bajo" style="grid-row:5;grid-column:2/4" onclick="rBoardClick('bajo',null,this)">1-18<span class="betBadge"></span></div>`;
  h += `<div class="rcell rout" data-key="par" style="grid-row:5;grid-column:4/6" onclick="rBoardClick('par',null,this)">PAR<span class="betBadge"></span></div>`;
  h += `<div class="rcell rout" data-key="negro" style="grid-row:5;grid-column:6/8" onclick="rBoardClick('negro',null,this)"><span class="diamond blk">◆</span><span class="betBadge"></span></div>`;
  h += `<div class="rcell rout" data-key="rojo" style="grid-row:5;grid-column:8/10" onclick="rBoardClick('rojo',null,this)"><span class="diamond rd">◆</span><span class="betBadge"></span></div>`;
  h += `<div class="rcell rout" data-key="impar" style="grid-row:5;grid-column:10/12" onclick="rBoardClick('impar',null,this)">IMPAR<span class="betBadge"></span></div>`;
  h += `<div class="rcell rout" data-key="alto" style="grid-row:5;grid-column:12/14" onclick="rBoardClick('alto',null,this)">19-36<span class="betBadge"></span></div>`;
  return h;
}
function rBoardClick(type, n, el){
  const key = type==='num' ? 'num'+n : type;
  const conflict = exclConflict(type);
  if(conflict){ document.getElementById('rLog').textContent = 'No puedes apostar a la vez en '+RLABELS[type]+' y '+RLABELS[conflict]+'.'; return; }
  if(activeChipVal===null) activeChipVal = selectedChip;
  const staked = Object.values(bets).reduce((a,b)=>a+b,0);
  if(staked + activeChipVal > state.money){ document.getElementById('rLog').textContent = 'No tienes saldo suficiente.'; return; }
  bets[key] = (bets[key]||0) + activeChipVal;
  document.getElementById('rLog').textContent = '';
  refreshBoardUI();
}
function clearBets(){
  bets = {}; activeChipVal = null;
  document.getElementById('rLog').textContent = '';

}
function refreshBoardUI(){
  document.querySelectorAll('#gameArea .rcell[data-key]').forEach(el=>{
    const amt = bets[el.dataset.key]||0;
    el.classList.toggle('sel', amt>0);
    const bd = el.querySelector('.betBadge');
    if(bd) bd.textContent = amt>0 ? amt+'€' : '';

  const tEl = document.getElementById('rTotalBet');
  if(tEl) tEl.textContent = total+'€';
  document.querySelectorAll('#gameArea .chip.val').forEach(c=>{
    const v = Number(c.dataset.v);
    c.classList.toggle('sel', v===selectedChip);
    c.classList.toggle('off', (activeChipVal!==null && v!==activeChipVal) || v>state.money);

function spinRuleta(){
  const keys = Object.keys(bets);
  if(keys.length===0){ document.getElementById('rLog').textContent='Elige al menos una apuesta.'; return; }
  const result = Math.floor(Math.random()*37);
  const isRed = ROJOS.includes(result);
  const cls = result===0?'green':isRed?'red':'black';
  document.getElementById('rResult').innerHTML = '<div class="pocket '+cls+'">'+result+'</div>';
  let net = 0;
  keys.forEach(key=>{
    const amt = bets[key];
    let win=false, mult=0;
    if(key.startsWith('num')){ win=result===Number(key.slice(3)); mult=35; }
    else if(key==='rojo'){ win=isRed; mult=2; }
    else if(key==='negro'){ win=result!==0 && !isRed; mult=2; }
    else if(key==='par'){ win=result!==0 && result%2===0; mult=2; }
    else if(key==='impar'){ win=result%2===1; mult=2; }
    else if(key==='bajo'){ win=result>=1 && result<=18; mult=2; }
    else if(key==='alto'){ win=result>=19 && result<=36; mult=2; }
    else if(key==='docena1'){ win=result>=1 && result<=12; mult=3; }
    else if(key==='docena2'){ win=result>=13 && result<=24; mult=3; }
    else if(key==='docena3'){ win=result>=25 && result<=36; mult=3; }
    net += win ? amt*(mult-1) : -amt;
  });
  state.money += net;
  document.getElementById('rLog').textContent = net>=0 ? '¡Ganas '+fmt(net)+' en total!' : 'Pierdes '+fmt(-net)+' en total.';
  bets = {}; activeChipVal = null;
  refreshBoardUI();
  updateHUD(); checkBust();
}

/* ---------- BLACKJACK ---------- */
let bj = {};
const SUITS=[['♠',false],['♥',true],['♦',true],['♣',false]];
function draw(){ const v=Math.min(10,1+Math.floor(Math.random()*13)); const s=SUITS[Math.floor(Math.random()*4)]; return {v:v===1?11:v, suit:s[0], red:s[1]}; }
function bjTotal(hand){
  let t=hand.reduce((a,b)=>a+b.v,0), aces=hand.filter(c=>c.v===11).length;
  while(t>21 && aces>0){ t-=10; aces--; }
  return t;
}
function renderBlackjack(){
  bj = {bet:0, player:[], dealer:[], over:false, dealt:false};
  document.getElementById('gameArea').innerHTML = `

  `;
  renderBjTable(true);
}
function bjDeal(){
  const bet = getValidBet('bBet','bLog');
  if(bet===null) return;
  bj.bet = bet; bj.player=[draw(),draw()]; bj.dealer=[draw(),draw()]; bj.over=false; bj.dealt=true;
  document.getElementById('bLog').textContent=''; renderBjTable(true);
}
function cardTag(c){ return '<span class="pc '+(c.red?'red':'black')+'">'+(c.v===11?'A':c.v)+'<span class="suit">'+c.suit+'</span></span>'; }
function renderBjTable(hideDealer){
  if(!bj.dealt){
    const backs = '<span class="pc back"></span><span class="pc back"></span>';
    document.getElementById('bjTable').innerHTML = `
      <div class="bjHalf"><h3>Banca</h3><div class="cards">${backs}</div></div>
      <div class="bjHalf"><h3>Tú</h3><div class="cards">${backs}</div></div>
    `;
    return;
  }
  const dHand = hideDealer ? [bj.dealer[0]] : bj.dealer;
  document.getElementById('bjTable').innerHTML = `
    <div class="bjHalf"><h3>Banca (${hideDealer?'?':bjTotal(bj.dealer)})</h3>
    <div class="cards">${dHand.map(cardTag).join('')}${hideDealer?'<span class="pc black">?</span>':''}</div></div>
    <div class="bjHalf"><h3>Tú (${bjTotal(bj.player)})</h3>
    <div class="cards">${bj.player.map(cardTag).join('')}</div></div>
    <div class="row">
      <button onclick="bjHit()" ${bj.over?'disabled':''}>Pedir</button>
      <button onclick="bjStand()" ${bj.over?'disabled':''}>Plantarse</button>
    </div>
  `;
}
function bjHit(){
  if(bj.over) return;
  bj.player.push(draw());
  if(bjTotal(bj.player)>21){ bjFinish(); } else { renderBjTable(true); }
}
function bjStand(){
  if(bj.over) return;
  while(bjTotal(bj.dealer)<17){ bj.dealer.push(draw()); }
  bjFinish();
}
function bjFinish(){
  bj.over=true;
  const p=bjTotal(bj.player), d=bjTotal(bj.dealer);
  let msg;
  if(p>21){ state.money-=bj.bet; msg='Te pasas de 21. Pierdes '+fmt(bj.bet)+'.'; }
  else if(d>21 || p>d){ state.money+=bj.bet; msg='¡Ganas '+fmt(bj.bet)+'!'; }
  else if(p===d){ msg='Empate. Recuperas tu apuesta.'; }
  else { state.money-=bj.bet; msg='Pierdes '+fmt(bj.bet)+'.'; }
  renderBjTable(false);
  document.getElementById('bLog').textContent = msg;
  updateHUD(); checkBust();
}

function runRace(){

      document.getElementById('hlane'+done).classList.add('winner');

        document.getElementById('cLog').textContent = '🏆 Gana '+race.names[done]+'. Pierdes '+fmt(bet)+'.';

      updateHUD(); checkBust();
    }
  }, 180);
}

/* ---------- PÓKER (VIP) ---------- */
let pk = {};
const PK_SUITS=[['♠',false],['♥',true],['♦',true],['♣',false]];
function pkNewDeck(){
  const d=[];
  for(let r=2;r<=14;r++) for(const s of PK_SUITS) d.push({r,suit:s[0],red:s[1]});
  for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=d[i]; d[i]=d[j]; d[j]=t; }
  return d;
}
function pkRankLabel(r){ return r===14?'A':r===13?'K':r===12?'Q':r===11?'J':r; }
function pkEvaluate(hand){
  const ranks=hand.map(c=>c.r).slice().sort((a,b)=>a-b);
  const suits=hand.map(c=>c.suit);
  const isFlush=suits.every(s=>s===suits[0]);
  const uniq=[...new Set(ranks)];
  let isStraight=false, hi=ranks[4];
  if(uniq.length===5){
    if(ranks[4]-ranks[0]===4) isStraight=true;
    else if(ranks[0]===2&&ranks[1]===3&&ranks[2]===4&&ranks[3]===5&&ranks[4]===14){ isStraight=true; hi=5; }
  }
  const counts={}; ranks.forEach(r=>counts[r]=(counts[r]||0)+1);
  const groups=Object.keys(counts).map(r=>({r:Number(r),c:counts[r]})).sort((a,b)=>b.c-a.c||b.r-a.r);
  if(isStraight&&isFlush&&hi===14&&ranks[0]===10) return {name:'Escalera Real',mult:250};
  if(isStraight&&isFlush) return {name:'Escalera de color',mult:50};
  if(groups[0].c===4) return {name:'Póker',mult:25};
  if(groups[0].c===3&&groups[1]&&groups[1].c===2) return {name:'Full',mult:9};
  if(isFlush) return {name:'Color',mult:6};
  if(isStraight) return {name:'Escalera',mult:4};
  if(groups[0].c===3) return {name:'Trío',mult:3};
  if(groups[0].c===2&&groups[1]&&groups[1].c===2) return {name:'Dos pares',mult:2};
  if(groups[0].c===2&&groups[0].r>=11) return {name:'Pareja de Jotas o mejor',mult:1};
  return {name:'Nada',mult:0};
}

const WHEEL = [
 {label:'PIERDES',mult:0,color:'#5a0e18',w:20},

 {label:'PIERDES',mult:0,color:'#7a1422',w:15},

 {label:'x5',mult:5,color:'#ff9a2e',w:4},
 {label:'PIERDES',mult:0,color:'#5a0e18',w:10}
];
let wheelRot = 0, wheelSpinning = false;
function wheelGradient(){
  let acc=0, stops=[];
  WHEEL.forEach(s=>{ const a=acc*3.6, b=(acc+s.w)*3.6; stops.push(s.color+' '+a+'deg '+b+'deg'); acc+=s.w; });
  return 'conic-gradient(from 0deg,'+stops.join(',')+')';
}
function wheelLabelsHTML(){
  let acc=0, out='';
  WHEEL.forEach(s=>{
    const mid=(acc+s.w/2)*3.6;
    out += '<div style="position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate('+mid+'deg)">'
         + '<div style="position:absolute;left:-22px;top:-116px;width:44px;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000">'+s.label+'</div>'
         + '</div>';
    acc+=s.w;
  });
  return out;
}
function renderRuletaSuerte(){
  wheelRot = 0; wheelSpinning = false;
  document.getElementById('gameArea').innerHTML = `
    <h2>Ruleta de la Suerte</h2>
    <p style="opacity:.75; font-size:13px">Apuesta y gira la rueda. Si cae en un multiplicador, tu apuesta se multiplica. Si cae en "Pierdes", pierdes la apuesta.</p>
    ${betInputHTML('wBet')}
    <div style="display:flex;justify-content:center;margin:18px 0">
      <div style="position:relative;width:260px;height:260px">
        <div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--gold);z-index:3;filter:drop-shadow(0 0 6px var(--gold))"></div>
        <div id="wWheel" style="width:260px;height:260px;border-radius:50%;border:6px solid var(--gold);box-shadow:0 0 30px rgba(255,210,74,.5),inset 0 0 20px rgba(0,0,0,.6);background:${wheelGradient()};transition:transform 3.2s cubic-bezier(.17,.67,.2,1);position:relative">${wheelLabelsHTML()}</div>
        <div style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(#fff,var(--gold));box-shadow:0 0 10px var(--gold);z-index:2"></div>
      </div>
    </div>
    <div class="row" style="justify-content:center"><button onclick="spinWheel()">Girar la rueda</button></div>
    <div class="paytable"><div>x2</div><div>x3</div><div>x5</div><div>x10</div><div>Pierdes</div></div>
    <div class="log" id="wLog"></div>
  `;
}
function spinWheel(){
  if(wheelSpinning) return;
  const bet = getValidBet('wBet','wLog');
  if(bet===null) return;
  wheelSpinning = true;
  document.getElementById('wLog').textContent = '';
  const r = Math.random()*100; let a=0, picked=null;
  for(const s of WHEEL){ if(r>=a && r<a+s.w){ picked=s; break; } a+=s.w; }
  if(!picked) picked = WHEEL[WHEEL.length-1];
  let accDeg=0; for(const s of WHEEL){ if(s===picked) break; accDeg += s.w*3.6; }
  const midDeg = accDeg + picked.w*3.6/2;
  const current = wheelRot%360;
  const targetMod = (360-midDeg+360)%360;
  let delta = targetMod-current; if(delta<=0) delta += 360;
  wheelRot += delta + 360*5;
  document.getElementById('wWheel').style.transform = 'rotate('+wheelRot+'deg)';
  setTimeout(()=>{
    wheelSpinning = false;
    if(picked.mult>0){ const gain=bet*(picked.mult-1); state.money+=gain; document.getElementById('wLog').textContent='¡Cae en '+picked.label+'! Ganas '+fmt(gain)+'.'; }
    else { state.money-=bet; document.getElementById('wLog').textContent='Cae en Pierdes. Pierdes '+fmt(bet)+'.'; }
    updateHUD(); checkBust();
  },3300);
}

function buildAvatar(){

const _ac=window.applyCostume;window.applyCostume=function(){_ac();buildAvatar();};

/* ===== CONTROL, CÁMARA Y BUCLE ===== */
const worldOn=()=>!$('world').classList.contains('hidden');
const KM={w:'ArrowUp',a:'ArrowLeft',s:'ArrowDown',d:'ArrowRight'};
addEventListener('keydown',e=>{if(!worldOn())return;const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(k.startsWith('Arrow')){pressed.add(k);e.preventDefault();}else if(KM[k])pressed.add(KM[k]);else if(k==='q'||k==='e')pressed.add(k);else if(e.key==='Enter'){e.preventDefault();window.act();}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;pressed.delete(k);pressed.delete(KM[k]);});
let dr=null;view.addEventListener('pointerdown',e=>{dr=e.clientX;});addEventListener('pointerup',()=>{dr=null;});addEventListener('pointermove',e=>{if(dr!==null){camYaw-=(e.clientX-dr)*.008;dr=e.clientX;}});
function setKind(k){kind=k;view.dataset.k=k;const h=$('wTitle');h.textContent=k==='v'?'✦ Sala VIP ✦':'La Última Mesa';
 h.style.cssText=k==='v'?'color:#ffe9a8;text-shadow:0 0 6px var(--gold),0 0 20px var(--gold)':k==='p'?'color:#dfe6ee;text-shadow:0 0 4px #9fc4e8':'';
 $('wSub').textContent={p:'Parking del casino. Acércate a la limusina para empezar la partida.',c:'Muévete por la sala y acércate a una mesa para jugar.',v:'Acceso exclusivo. Pronto habrá mesas de alto nivel aquí.'}[k];
 $('wHint').textContent=(k==='p'?'Ve a la limusina para jugar, o a la tienda. ':k==='v'?'Acércate a la barra para pedir. Vuelve por el arco dorado a la sala principal. ':'')+'Flechas / WASD para moverte, arrastra o Q/E para girar la cámara, Enter para interactuar.';}
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);
function hideAll(){['world','shop','game'].forEach(i=>$(i).classList.add('hidden'));}
function show(s){scene=s;hideAll();$('world').classList.remove('hidden');pressed.clear();Z.parking.g.visible=s==='parking';Z.casino.g.visible=s==='casino';kind='';lastTxt='';lastDis=null;snap=true;resize();}
window.goLobby=()=>{show('casino');startTimer();};
window.goVip=window.goLobby;
window.goParking=()=>show('parking');

let last=performance.now();const tg=new T.Vector3();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!worldOn()||!view.clientWidth)return;
 const zn=Z[scene],p=zn.p;
 camYaw+=((pressed.has('q')?1:0)-(pressed.has('e')?1:0))*dt*2;
 let ix=(pressed.has('ArrowRight')?1:0)-(pressed.has('ArrowLeft')?1:0),iz=(pressed.has('ArrowDown')?1:0)-(pressed.has('ArrowUp')?1:0);
 moving=!!(ix||iz);
 if(moving){const l=Math.hypot(ix,iz);ix/=l;iz/=l;const s=Math.sin(camYaw),c=Math.cos(camYaw),dx=c*ix+s*iz,dz=-s*ix+c*iz;
  p.x+=dx*9*dt;p.z+=dz*9*dt;let d=Math.atan2(dx,dz)-p.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));p.yaw+=d*Math.min(1,dt*12);
  for(const b of zn.cols){if(b.off&&b.off())continue;const qx=Math.max(b.x0,Math.min(p.x,b.x1)),qz=Math.max(b.z0,Math.min(p.z,b.z1)),ex=p.x-qx,ez=p.z-qz,dd=Math.hypot(ex,ez);
   if(dd<.55){if(dd>1e-4){p.x=qx+ex/dd*.55;p.z=qz+ez/dd*.55;}else p.x=b.x0-.55;}}}
 let best=null,bdist=2.4;
 for(const o of zn.ia){if(o.hide&&o.hide())continue;const d=Math.hypot(Math.max(o.x0-p.x,0,p.x-o.x1),Math.max(o.z0-p.z,0,p.z-o.z1));if(d<bdist){bdist=d;best=o;}}
 cur=best;zn.ia.forEach(o=>{o.ring.visible=o===cur;});
 const txt=cur?cur.label():'Acércate a algo',dis=!cur||!!(cur.dis&&cur.dis());
 if(txt!==lastTxt){$('actBtn').textContent=txt;lastTxt=txt;}if(dis!==lastDis){$('actBtn').disabled=dis;lastDis=dis;}
 $('skipBtn').style.display=scene==='casino'?'':'none';
 const k=scene==='parking'?'p':(p.x<-35?'v':'c');if(k!==kind)setKind(k);
 spin.forEach(s=>{s.rotation.y+=dt*.8;});
 walkT+=moving?dt*10:0;const sw=moving?Math.sin(walkT)*.75:0;
 pr.lL.rotation.x+=(sw-pr.lL.rotation.x)*.35;pr.lR.rotation.x+=(-sw-pr.lR.rotation.x)*.35;pr.aL.rotation.x+=(-sw-pr.aL.rotation.x)*.35;pr.aR.rotation.x+=(sw-pr.aR.rotation.x)*.35;
 bod.position.y=moving?Math.abs(Math.sin(walkT))*.1:0;
 av.position.set(p.x,0,p.z);av.rotation.y=p.yaw;gate.visible=state.day<VIP_UNLOCK_DAY;
 tg.set(p.x+Math.sin(camYaw)*9.5,6.5,p.z+Math.cos(camYaw)*9.5);if(snap){cam.position.copy(tg);snap=false;}else cam.position.lerp(tg,Math.min(1,dt*6));
 cam.lookAt(p.x,1.6,p.z);ren.render(scn,cam);}
buildAvatar();Z.casino.g.visible=false;resize();requestAnimationFrame(frame);
})();
