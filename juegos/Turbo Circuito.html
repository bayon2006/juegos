const p=P[j],q=P[j2],n=NR[j],n2=NR[j2];a.l+=(a.l0+Math.sin(a.p*.03+a.ph)*2.5-a.l)*Math.min(1,1.5*dt);a.hd+=wr(Math.atan2(q.x-p.x,q.z-p.z)-a.hd)*Math.min(1,8*dt);
a.o.position.set(p.x+(q.x-p.x)*f+(n.x+(n2.x-n.x)*f)*a.l,p.y+(q.y-p.y)*f,p.z+(q.z-p.z)*f+(n.z+(n2.z-n.z)*f)*a.l);a.o.rotation.y=a.hd;a.o.rotation.x=-Math.atan(SL[j]);})}
function near(){let bi=s.i,bd=1e9;for(let d=-30;d<=30;d++){const j=(s.i+d+N*2)%N,dx=s.x-P[j].x,dz=s.z-P[j].z,q=dx*dx+dz*dz;if(q<bd){bd=q;bi=j}}let dl=bi-s.i;if(dl>N/2)dl-=N;if(dl<-N/2)dl+=N;s.tot+=dl;s.i=bi;s.d=Math.sqrt(bd);s.sl=(s.x-P[bi].x)*NR[bi].x+(s.z-P[bi].z)*NR[bi].z;s.lat=Math.abs(s.sl)}
function flash(t){$('msg').textContent=t;setTimeout(()=>{if(mode=='race')$('msg').textContent=''},900)}
const PT=[15,12,10,8,6,4,2,1],NM=['Tú','Azul','Amarillo','Verde','Morado','Rosa','Cian','Blanco'],CC=[0xff4a2b,0x3aa0ff,0xf5c400,0x9be564,0xb05cff,0xff8fd8,0x19f0ff,0xffffff];let cup=null;
const cdot=i=>`<i class="dt" style="background:${hx(CC[i])}"></i>`;
function startCup(){const o=TR.map((_,i)=>i);for(let i=o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}cup={tr:o.slice(0,MODES[mod].cup),r:0,h:[]};go(cup.tr[0])}
function cupNext(){go(cup.tr[cup.r])}
function cupEnd(){const rk=[{i:0,t:s.tot},...ai.map((a,k)=>({i:k+1,t:a.p}))].sort((a,b)=>b.t-a.t),g=NM.map(()=>0);rk.forEach((x,p)=>g[x.i]=PT[p]);cup.h.push(g);cup.r++;
const tot=NM.map((_,i)=>cup.h.reduce((a,x)=>a+x[i],0)),last=cup.r>=cup.tr.length,me=rk.findIndex(x=>!x.i)+1;
$('msg').innerHTML=`<div class="res cp"><h2>Carrera ${cup.r}/${cup.tr.length}: ${me}º</h2><p>${TR[idx].n} · Tu tiempo ${fmt(s.t)}</p><table class="rt"><tr><th></th><th>Piloto</th><th>Puntos</th><th>Total</th></tr>${rk.map((x,p)=>`<tr class="${x.i?'':'me'}"><td>${p+1}º</td><td>${cdot(x.i)}${NM[x.i]}</td><td class="g">+${g[x.i]}</td><td>${tot[x.i]}</td></tr>`).join('')}</table>${last?'<button onclick="cupFinal()">Resultado final</button>':'<p>Siguiente circuito: <b>'+TR[cup.tr[cup.r]].n+'</b></p><button onclick="cupNext()">Siguiente carrera</button>'}</div>`}
function cupFinal(){const n=cup.tr.length,tot=NM.map((_,i)=>cup.h.reduce((a,x)=>a+x[i],0)),o=NM.map((_,i)=>i).sort((a,b)=>{if(tot[b]!=tot[a])return tot[b]-tot[a];for(let r=n-1;r>=0;r--)if(cup.h[r][b]!=cup.h[r][a])return cup.h[r][b]-cup.h[r][a];return a-b}),me=o.indexOf(0)+1;
$('msg').innerHTML=`<div class="res cp"><h2>${me==1?'¡Campeón de la copa!':'Resultado final: '+me+'º de '+NM.length}</h2><p>${cup.tr.map((t,r)=>'C'+(r+1)+' '+TR[t].n).join(' · ')}</p><table class="rt"><tr><th></th><th>Piloto</th>${cup.tr.map((_,r)=>'<th>C'+(r+1)+'</th>').join('')}<th>Total</th></tr>${o.map((i,p)=>`<tr class="${i?'':'me'}"><td>${p+1}º</td><td>${cdot(i)}${NM[i]}</td>${cup.h.map(x=>'<td>'+x[i]+'</td>').join('')}<td class="g"><b>${tot[i]}</b></td></tr>`).join('')}</table><button onclick="startCup()">Nueva copa</button><button onclick="modes()">Modos</button></div>`}
function finish(lost){mode='fin';if(mo.cup)return cupEnd();const r=1+ai.filter(a=>!a.out&&a.p>s.tot).length,b=ld(bk(idx)),nb=!lost&&!mo.el&&(!b||s.t<b);if(nb)sv(bk(idx),s.t);
$('msg').innerHTML=`<div class="res"><h2>${lost?'Eliminado':mo.el?'¡Último en pie!':r+'º de '+(mo.bots+1)}</h2><p>${fmt(s.t)}${mo.el?'':nb?' · ¡Nuevo récord!':' · Mejor '+(b?fmt(b):'—')}</p><button onclick="go(idx)">Reintentar</button><button onclick="menu()">Circuitos</button></div>`}
function frame(dt){const I=mode=='race'?keys:{},st=(I.ArrowLeft||I.KeyA?1:0)-(I.ArrowRight||I.KeyD?1:0),U=I.ArrowUp||I.KeyW,D=I.ArrowDown||I.KeyS;rew=false;
if(mode=='count'){cd-=dt;$('msg').textContent=cd>0?Math.ceil(cd):'¡YA!';if(cd<=0){mode='race';setTimeout(()=>{if(mode=='race')$('msg').textContent=''},700)}}
if(I.KeyR&&s.en>0&&hist.length>2){rew=true;for(let q=0;q<2&&hist.length>1;q++)Object.assign(s,hist.pop());s.en=Math.max(0,s.en-28*dt);s.boost=0;s.dr=0;s.charge=0}
else{const on=s.lat<w/2+.5;let mx=on?62:34;if(s.boost>0){mx=Math.max(mx,on?100:60);s.boost-=dt}
if(U)s.v+=(s.boost>0?75:32)*dt;if(D)s.v-=(s.v>0?60:25)*dt;s.v-=s.v*(on?.25:1.1)*dt+SL[s.i]*Math.cos(s.h-HD[s.i])*14*dt;if(s.v>mx)s.v-=(s.v-mx)*3*dt;if(s.v<-15)s.v=-15;
if(I.Space&&s.v>28){if(!s.dr&&st)s.dr=st}else if(s.dr){if(s.charge>.5)s.boost=Math.min(s.charge,2.6);s.dr=0;s.charge=0}
const ef=s.dr?s.dr*.5+st*.6:st;if(s.dr)s.charge+=dt*(.5+Math.abs(ef));
s.h+=ef*2.2*dt*Math.min(1,Math.abs(s.v)/22)*(s.v<0?-1:1);s.m+=wr(s.h-s.m)*Math.min(1,(s.dr?1.6:9)*dt);
s.x+=Math.sin(s.m)*s.v*dt;s.z+=Math.cos(s.m)*s.v*dt;if(mode=='race'&&s.v>1)s.en=Math.min(100,s.en+7*dt);s.eff=ef;
hist.push({x:s.x,z:s.z,h:s.h,m:s.m,v:s.v,tot:s.tot,i:s.i});if(hist.length>420)hist.shift()}
near();if(s.d>w/2+14){const p=P[s.i],k=(w/2+14)/s.d;s.x=p.x+(s.x-p.x)*k;s.z=p.z+(s.z-p.z)*k;s.v*=1-3*dt}
if(mode=='race'||mode=='fin')s.t+=mode=='race'?dt:0;
const lp=Math.min(laps,Math.max(1,Math.floor(s.tot/N)+1));if(lp>s.lp&&mode=='race'){s.lp=lp;if(!mo.el)flash('Vuelta '+lp+'/'+laps)}
if(mode=='race'&&!mo.el&&s.tot>=N*laps)finish();if(mode=='race'&&mo.el){elT-=dt;if(elT<=0){elT=mo.el;elim()}}
const gy=s.lat<w/2+2?ry():th(s.x,s.z,-.5);cy=Math.max(gy,cy+(gy-cy)*Math.min(1,30*dt));car.position.set(s.x,cy,s.z);car.rotation.y=s.h;car.rotation.x=-Math.atan(SL[s.i]);car.rotation.z=-(s.eff||0)*.08*Math.min(1,Math.abs(s.v)/40);car.userData.f.visible=s.boost>0;car.userData.f.scale.y=2+Math.random();
bots(dt);
ch+=wr(s.h-ch)*Math.min(1,4*dt);const fx=Math.sin(ch),fz=Math.cos(ch);camY+=(cy+4.6-camY)*Math.min(1,6*dt);cam.position.set(s.x-fx*9,camY,s.z-fz*9);cam.lookAt(s.x+fx*7,cy+1.5,s.z+fz*7);
cam.fov=64+Math.abs(s.v)*.22+(s.boost>0?10:0);cam.updateProjectionMatrix();sky.position.copy(cam.position);
if(parts){const pt=T.pt;if(pt.far)parts.position.copy(cam.position);else{const a=parts.geometry.attributes.position.array,by=cy-8;for(let k=0;k<pt.n;k++){const o=k*3;a[o+1]+=pt.vy*dt;a[o+1]=by+((a[o+1]-by)%50+50)%50;if(a[o]-s.x>120)a[o]-=240;if(a[o]-s.x<-120)a[o]+=240;if(a[o+2]-s.z>120)a[o+2]-=240;if(a[o+2]-s.z<-120)a[o+2]+=240}parts.geometry.attributes.position.needsUpdate=true}}
renderer.domElement.style.filter=rew?'hue-rotate(170deg) saturate(1.6) blur(1px)':'';
$('spd').textContent=Math.abs(s.v*3|0);$('pos').textContent=(1+ai.filter(a=>!a.out&&a.p>s.tot).length)+'º';$('lap').textContent=mo.el?'Elimina en '+Math.ceil(elT)+' s · quedan '+(ai.filter(a=>!a.out).length+1):'Vuelta '+s.lp+'/'+laps;$('tm').textContent=fmt(s.t);
$('b1').style.width=(s.boost>0?100:Math.min(100,s.charge/2.6*100))+'%';$('b1').style.background=s.boost>0?'#ff5a3c':'#ffb703';$('b2').style.width=s.en+'%';mini();$('off').style.opacity=(mode=='race'&&s.lat>=w/2+.5&&!rew)?1:0}
let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(scene&&mode!='menu'){frame(dt);renderer.render(scene,cam)}}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Escape'){if(mode!='menu'){mo.cup?modes():menu()}else if(scr)modes()}if(mode=='menu'&&!scr){const n=MODES.length;if(e.code=='ArrowDown'||e.code=='ArrowRight'){mod=(mod+1)%n;modes()}if(e.code=='ArrowUp'||e.code=='ArrowLeft'){mod=(mod+n-1)%n;modes()}if(e.code=='Enter'){e.preventDefault();MODES[mod].cup?startCup():menu()}}else if(mode=='menu'){if(e.code=='ArrowDown'||e.code=='ArrowRight'){sel=(sel+1)%8;cards()}if(e.code=='ArrowUp'||e.code=='ArrowLeft'){sel=(sel+7)%8;cards()}if(e.code=='Enter'){e.preventDefault();go(sel)}if(e.code=='KeyM')modes()}if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);addEventListener('blur',()=>keys={});
modes();requestAnimationFrame(loop);
</script></body></html>
